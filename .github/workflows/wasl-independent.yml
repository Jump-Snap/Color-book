name: Wasl independent web
on:
  pull_request:
    paths: ["wasl-web/**", ".github/workflows/wasl-independent.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: wasl-web
    env:
      VITE_SUPABASE_URL: https://suokxziofqqsqcnncepc.supabase.co
      VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_p5Iv709HsV1-sLBD6TTIaQ_CXTJWjaQ
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm build
      - uses: actions/upload-artifact@v4
        with:
          name: wasl-independent-web
          path: wasl-web/dist
          if-no-files-found: error
          retention-days: 14
