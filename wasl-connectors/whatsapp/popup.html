<!doctype html><html lang="ar" dir="rtl"><meta charset="UTF-8"><title>وصل — واتساب</title><style>body{font:13px Tahoma,sans-serif;width:330px;margin:0;padding:20px;color:#274b40;background:#f7faf8}h1{font-size:20px}p{line-height:1.8;color:#71877b}input,select,button{box-sizing:border-box;width:100%;padding:11px;border-radius:8px;border:1px solid #d2e0d7;margin:7px 0;font:inherit}button{cursor:pointer;background:#12665b;color:white}button:disabled{opacity:.5}small{font-size:11px}output{display:block;line-height:1.8;margin-top:12px;white-space:pre-wrap}</style><h1>وصل • قائمة Paid</h1><p>افتح WhatsApp Web، اختار Paid، وسيب التبويب مفتوحًا أثناء التشغيل الدوري. الأسماء بدون رقم تحتاج مراجعة.</p><form id="connect"><label>رابط وصل<input id="origin" type="url" required dir="ltr" placeholder="https://…macaly.app"></label><label>رمز اقتران واتساب من التطبيق<input id="token" type="password" required autocomplete="off"></label><label>طريقة التشغيل<select id="interval"><option value="0">لما أطلب فقط</option><option value="1">كل ساعة</option><option value="3">كل 3 ساعات</option><option value="6">كل 6 ساعات</option><option value="12">كل 12 ساعة</option><option value="24">كل 24 ساعة</option></select></label><button>حفظ الربط</button></form><button id="read">اقرأ Paid الآن</button><small>الأداة لا ترسل رسائل واتساب، وتنقل أرقام القائمة فقط إلى تطبيقك.</small><output id="status" role="status"></output><script src="popup.js" type="module"></script></html>
