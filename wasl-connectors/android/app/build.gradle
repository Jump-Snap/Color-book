plugins { id 'com.android.application' }
android {
 namespace 'app.wasl.companion'
 buildFeatures { buildConfig true }
 def waslOrigin = providers.gradleProperty('waslWebOrigin').orElse(providers.environmentVariable('WASL_WEB_ORIGIN')).getOrElse('https://example.invalid')
 if (!(waslOrigin ==~ /https:\/\/[a-zA-Z0-9.-]+/)) throw new GradleException('WASL_WEB_ORIGIN must be an HTTPS origin without a path')
 compileSdk 36
 defaultConfig { applicationId 'app.wasl.companion'; minSdk 26; targetSdk 36; versionCode 7; versionName '0.7.0'; testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'; buildConfigField 'String', 'WASL_WEB_ORIGIN', '"' + waslOrigin + '"' }
 compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
dependencies {
 implementation 'androidx.webkit:webkit:1.17.1'
 implementation 'com.google.firebase:firebase-messaging:26.0.0'
 androidTestImplementation 'androidx.test:runner:1.6.2'
 androidTestImplementation 'androidx.test.ext:junit:1.2.1'
 androidTestImplementation 'androidx.test.uiautomator:uiautomator:2.3.0'
}
